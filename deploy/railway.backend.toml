# Railway — Backend service
# Point this file in Railway: Service → Settings → Config-as-code → railway.toml path
# Root directory for this service: / (repository root)

[build]
builder = "DOCKERFILE"
dockerfilePath = "backend/Dockerfile"
watchPatterns = [
  "backend/**",
  "config/**",
  "face_recognition/**",
  "gesture_detection/**",
  "overlay_engine/**",
  "utils/**",
  "requirements.txt",
  "storage/embeddings/users.json",
]

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
numReplicas = 1

# Persistent export artifacts (feedback retrain flow):
#   1. Railway dashboard → this service → Volumes → mount e.g. /data
#   2. Set runtime env: DATASET_EXPORT_DIR=/data/dataset_exports
# Without a volume, JSONL/manifest files are lost on redeploy/restart.
#
# Migrations: run once via backend/scripts/railway_migrate.sh (NOT in docker-entrypoint.sh).
